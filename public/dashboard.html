<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard réseau</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f7;color:#171717}
    main{max-width:1100px;margin:auto;padding:42px 20px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    input,button{padding:10px 12px;border-radius:8px;border:1px solid #ccc}button{background:#111;color:#fff;border-color:#111;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}.card{background:#fff;border-radius:16px;padding:22px;min-height:420px;box-shadow:0 1px 8px #0000000c}
    .chart{height:330px;position:relative}#status{margin-top:12px;color:#555}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>Dashboard réseau</h1><div id="status">Authentification requise.</div></div><div><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">Charger</button></div></header>
  <section class="grid">
    <article class="card"><h2>Opérateurs Internet</h2><div class="chart"><canvas id="operators"></canvas></div></article>
    <article class="card"><h2>Utilisation VPN</h2><div class="chart"><canvas id="vpn"></canvas></div></article>
  </section>
</main>
<script>
let operatorChart, vpnChart;
const status = document.querySelector("#status");

document.querySelector("#load").addEventListener("click", loadDashboard);

async function loadDashboard(){
  const token=document.querySelector("#token").value;
  status.textContent="Chargement…";
  const r=await fetch("/network-analytics/dashboard",{headers:{Authorization:`Bearer ${token}`}});
  if(!r.ok){status.textContent=r.status===401?"Accès refusé.":"Erreur de chargement.";return}
  const data=await r.json();
  renderOperators(data.operators);
  renderVpn(data.vpn);
  const total=data.operators.reduce((n,x)=>n+x.value,0);
  status.textContent=`${total} visite(s) agrégée(s)`;
}

function renderOperators(rows){
  operatorChart?.destroy();
  operatorChart=new Chart(document.querySelector("#operators"),{
    type:"pie",
    data:{labels:rows.map(x=>x.name),datasets:[{data:rows.map(x=>x.value)}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}
  });
}

function renderVpn(vpn){
  vpnChart?.destroy();
  vpnChart=new Chart(document.querySelector("#vpn"),{
    type:"pie",
    data:{labels:["Non","Oui"],datasets:[{data:[vpn.no,vpn.yes]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}
  });
}
</script></body></html>
